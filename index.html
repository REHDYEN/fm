<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top 10 Emisoras de Colombia</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#ffb300', // yellow
                            600: '#e53935', // red
                            700: '#1e88e5', // blue
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-gray-800 shadow-md py-6 px-4 md:px-8 flex justify-between items-center sticky top-0 z-10 border-b border-gray-700">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-brand-500 via-brand-700 to-brand-600 flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-radio text-white text-xl"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">Col<span class="text-brand-500">om</span><span class="text-brand-700">b</span><span class="text-brand-600">ia</span> FM</h1>
        </div>
        <div class="text-sm text-gray-400 hidden sm:block">
            El Top 10 de tus emisoras favoritas
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-8 md:py-12 max-w-5xl">

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- Player Section (Sticky on Desktop) -->
            <div class="lg:col-span-1">
                <div class="bg-gray-800 rounded-2xl shadow-2xl p-6 sticky top-28 border border-gray-700 overflow-hidden relative">
                    <!-- Decorational abstract blob -->
                    <div class="absolute -top-10 -right-10 w-32 h-32 bg-brand-700 rounded-full mix-blend-multiply filter blur-2xl opacity-20 animate-pulse"></div>
                    <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-brand-500 rounded-full mix-blend-multiply filter blur-2xl opacity-20 animate-pulse" style="animation-delay: 2s;"></div>

                    <div class="text-center mb-6 relative z-10">
                        <div id="station-logo-container" class="w-40 h-40 mx-auto rounded-full bg-gray-700 shadow-inner flex items-center justify-center mb-4 border-4 border-gray-600 overflow-hidden transition-all duration-300">
                            <i id="default-logo" class="fa-solid fa-music text-5xl text-gray-500"></i>
                            <img id="station-img" src="" alt="Station Logo" class="w-full h-full object-cover hidden">
                        </div>
                        <h2 id="current-station-name" class="text-2xl font-bold text-white mb-1">Selecciona una Emisora</h2>
                        <p id="current-station-freq" class="text-brand-500 font-medium text-sm">-- FM</p>

                        <!-- Equalizer Animation (Hidden by default) -->
                        <div id="equalizer" class="flex justify-center items-end h-8 gap-1 mt-4 opacity-0 transition-opacity duration-300">
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                        </div>
                    </div>

                    <!-- Controls -->
                    <div class="space-y-6 relative z-10">
                        <div class="flex justify-center items-center gap-6">
                            <button id="btn-prev" class="text-gray-400 hover:text-white transition-colors p-2 focus:outline-none" aria-label="Anterior">
                                <i class="fa-solid fa-backward-step text-xl"></i>
                            </button>

                            <button id="btn-play-pause" class="w-16 h-16 rounded-full bg-brand-500 hover:bg-yellow-400 text-gray-900 flex items-center justify-center shadow-lg shadow-yellow-500/30 transition-all hover:scale-105 focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed">
                                <i id="play-icon" class="fa-solid fa-play text-2xl ml-1"></i>
                            </button>

                            <button id="btn-next" class="text-gray-400 hover:text-white transition-colors p-2 focus:outline-none" aria-label="Siguiente">
                                <i class="fa-solid fa-forward-step text-xl"></i>
                            </button>
                        </div>

                        <!-- Volume -->
                        <div class="flex items-center gap-3 bg-gray-900 p-3 rounded-lg border border-gray-700">
                            <i id="volume-icon" class="fa-solid fa-volume-high text-gray-400 text-sm w-5 text-center"></i>
                            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-brand-500">
                        </div>
                    </div>

                    <div id="status-message" class="text-center text-xs text-gray-500 mt-4 h-4"></div>
                </div>
            </div>

            <!-- Stations List Section -->
            <div class="lg:col-span-2">
                <div class="bg-gray-800 rounded-2xl shadow-xl p-6 border border-gray-700">
                    <div class="flex justify-between items-center mb-6 pb-4 border-b border-gray-700">
                        <h3 class="text-xl font-bold flex items-center gap-2">
                            <i class="fa-solid fa-ranking-star text-brand-500"></i>
                            Top 10 Emisoras
                        </h3>
                        <span class="bg-gray-700 text-xs py-1 px-3 rounded-full text-gray-300">En Vivo</span>
                    </div>

                    <!-- Station List Container -->
                    <div id="station-list" class="space-y-3">
                        <!-- Items will be generated via JS -->
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-950 py-6 text-center border-t border-gray-800 mt-auto">
        <p class="text-gray-500 text-sm">
            &copy; 2024 Colombia FM. Diseño creado con <i class="fa-solid fa-heart text-red-500 mx-1"></i> y Tailwind CSS.
        </p>
    </footer>

    <!-- Audio Element -->
    <audio id="audio-player" preload="none"></audio>

    <!-- App Script -->
    <script src="app.js"></script>
</body>
</html>
